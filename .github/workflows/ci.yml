name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:core
      # Software WebGPU (SwiftShader, 4 storage textures): covers the 1- and
      # 4-level kernels. 5/6-level kernels and timing need real GPUs (device lab).
      - run: node test/run.js --quick --adapter=swiftshader
