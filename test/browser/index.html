<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>downsampler device lab</title>
		<link rel="icon" href="data:,">
		<style>
			:root { color-scheme: light dark; font: 15px/1.45 system-ui, sans-serif; }
			body { margin: 0 auto; padding: 16px; max-width: 960px; }
			button { font: inherit; padding: 8px 14px; margin: 0 8px 8px 0; }
			pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; background: rgba(127,127,127,.12); padding: 12px; border-radius: 6px; }
			table { border-collapse: collapse; font-size: 13px; margin: 12px 0; display: block; overflow-x: auto; }
			th, td { padding: 4px 10px; text-align: right; border-bottom: 1px solid rgba(127,127,127,.3); white-space: nowrap; }
			th:first-child, td:first-child { text-align: left; }
		</style>
	</head>
	<body>
		<h1>downsampler device lab</h1>
		<p>Runs the GPU validation suite and benchmark on this device and produces a JSON report. Close other GPU-heavy tabs for stable timings.</p>
		<button id="validate">Validate</button>
		<button id="quick">Quick validate</button>
		<button id="bench">Validate + benchmark</button>
		<button id="copy" disabled>Copy JSON report</button>
		<div id="table"></div>
		<pre id="status">Ready.</pre>
		<script type="module">
			import { requestDevice } from './gpu.js';
			import { validate } from './validate.js';
			import { benchmark } from '../bench/bench.js';
			import { quality } from '../bench/quality.js';
			import { checkWebgpuSpd } from '../bench/webgpu-spd.js';

			const status = document.getElementById( 'status' );
			let report = null;

			// Entry point for the headless runner (test/run.js) and the buttons below.
			// `compare: 'spd'` times the odd-size strategies (M2T.4); `quality` measures 'spd' against 'exact'.
			// `shard` ({ index, total }), `durations` and `list`: CI shards of the validation suite (test/ci/README.md).
			// M3 measurement modes (test/bench/README.md): `compare: 'throughput' | 'storage-usage' | 'subgroups' | 'f16'`,
			// `strategies` (a subset to time), `throughput` (add per-frame throughput), `bench` throughput options,
			// `timestampQuery: false` (a device without timestamp-query, as on devices that lack it).
			window.runSuite = async ( { bench = false, quick = false, only, sizes, formats, rounds, repeats, compat = false, compare, quality: measureQuality = false, skipValidation = false, webgpuSpdCheck = false, frames, shard, durations, list = false, keepGoing = false, strategies, throughput = false, noTimestamps = false, timestampQuery = true, windowMs, pacing, inFlight, batchMs, maxBatch, textures } = {} ) => {

				// webgpu-spd (results/compare/webgpu-spd.md) runs with the features and limits it uses: subgroups, shader-f16, the adapter's storage texture limit.
				const webgpuSpd = compare === 'webgpu-spd' || webgpuSpdCheck;
				const features = webgpuSpd ? [ 'subgroups', 'shader-f16' ] : compare === 'subgroups' ? [ 'subgroups' ] : compare === 'f16' ? [ 'shader-f16' ] : [];
				const { device, adapter, userAgent } = await requestDevice( { compat, maxStorageTextures: compare === 'spd' || webgpuSpd, features, timestamps: timestampQuery } );
				const errors = [];
				device.addEventListener( 'uncapturederror', event => errors.push( event.error.message ) );
				device.lost.then( info => { if ( info.reason !== 'destroyed' ) errors.push( `device lost: ${ info.message }` ); } );
				const progress = message => { status.textContent = typeof message === 'string' ? message : `${ message.width }x${ message.height }x${ message.layers } ${ message.format } done`; console.log( 'PROGRESS ' + status.textContent ); };

				try {

					const validation = skipValidation ? { passed: true, cases: 0, checks: 0, skipped: [], ms: 0, results: [] } : await validate( device, { onProgress: progress, quick, only, shard, durations, list, keepGoing } );
					const timing = bench ? await benchmark( device, { sizes, formats, rounds, repeats, compare, strategies, throughput, noTimestamps, windowMs, pacing, inFlight, batchMs, maxBatch, textures, onProgress: progress } ) : null;
					const qualityResults = measureQuality ? await quality( device, { sizes, formats, onProgress: progress } ) : null;
					const webgpuSpdResults = webgpuSpdCheck ? await checkWebgpuSpd( device, { sizes, formats, frames, onProgress: progress } ) : null;
					await device.queue.onSubmittedWorkDone();
					if ( errors.length ) throw new Error( errors.join( '\n' ) );
					return { date: new Date().toISOString(), adapter, userAgent, validation, timing, quality: qualityResults, webgpuSpd: webgpuSpdResults };

				} finally {

					device.destroy();

				}

			};

			function renderTable( timing ) {

				if ( ! timing?.results.length ) return '';
				const names = timing.strategies;
				const rows = timing.results.map( row => `<tr><td>${ row.width }×${ row.height }×${ row.layers }</td><td>${ row.format }</td>${ names.map( name => `<td>${ row.gpuMs[ name ].toFixed( 4 ) }</td><td>${ row.passes[ name ] }</td>` ).join( '' ) }<td>${ ( row.gpuMs.render / row.gpuMs[ names.filter( name => name.startsWith( 'compute' ) ).pop() ] ).toFixed( 2 ) }×</td></tr>` );
				return `<table><tr><th>size</th><th>format</th>${ names.map( name => `<th>${ name } ms</th><th>passes</th>` ).join( '' ) }<th>speedup</th></tr>${ rows.join( '' ) }</table>`;

			}

			for ( const id of [ 'validate', 'quick', 'bench' ] ) document.getElementById( id ).onclick = async () => {

				document.querySelectorAll( 'button' ).forEach( button => button.disabled = true );

				try {

					report = await window.runSuite( { bench: id === 'bench', quick: id === 'quick' } );
					const { results, ...summary } = report.validation;
					status.textContent = JSON.stringify( { ...report, validation: summary, timing: report.timing && { ...report.timing, results: report.timing.results.map( ( { samples, ...row } ) => row ) } }, null, 2 );
					document.getElementById( 'table' ).innerHTML = renderTable( report.timing );

				} catch ( error ) {

					status.textContent = `FAILED\n${ error.stack || error }`;

				} finally {

					document.querySelectorAll( 'button' ).forEach( button => button.disabled = false );
					document.getElementById( 'copy' ).disabled = report === null;

				}

			};

			document.getElementById( 'copy' ).onclick = () => navigator.clipboard.writeText( JSON.stringify( report, null, 2 ) );
		</script>
	</body>
</html>
