<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js - cube vs 2d-array render-pass mipmaps</title>
		<meta charset="utf-8">
	</head>
	<body>
		<script type="module">

			// Render-pass mipmaps (WebGPUTexturePassUtils.generateMipmaps) of the same six rgba8 faces,
			// once as a cube (textureBindingViewDimension 'cube', main_cube) and once as a 2d-array
			// (main_2d_array). Each level is also checked against a CPU reference of render-pass
			// semantics (bilinear, clamp to edge, at each destination texel center in normalized
			// coordinates) computed from that path's own previous level.
			// ?compat: compatibility-mode device. ?sizes=33,32,31

			import WebGPUTexturePassUtils from '../../src/renderers/webgpu/utils/WebGPUTexturePassUtils.js';
			import { toHalfFloat, fromHalfFloat } from '../../src/extras/DataUtils.js';

			const params = new URLSearchParams( location.search );
			const compat = params.has( 'compat' );
			const sizes = ( params.get( 'sizes' ) || '33,32,31,17,65,64,63' ).split( ',' ).map( Number );
			const format = params.get( 'format' ) || 'rgba8unorm'; // or rgba16float; values are reported in 8-bit steps (1/255)
			const half = format === 'rgba16float', texelBytes = half ? 8 : 4;

			const adapter = await navigator.gpu.requestAdapter( compat ? { featureLevel: 'compatibility' } : {} );
			const device = await adapter.requestDevice();
			const errors = [];
			device.addEventListener( 'uncapturederror', ( event ) => errors.push( event.error.message ) );

			const passUtils = new WebGPUTexturePassUtils( device );

			let state = 1234567;
			const next = () => ( state = ( Math.imul( state, 1664525 ) + 1013904223 ) >>> 0 ) / 4294967296;

			const reported = {};

			function create( size, viewDimension, levels ) {

				const texture = device.createTexture( {
					size: [ size, size, 6 ], format, mipLevelCount: levels,
					usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_DST | GPUTextureUsage.COPY_SRC,
					textureBindingViewDimension: viewDimension
				} );

				// three reads textureGPU.textureBindingViewDimension; core devices may not report it.
				reported[ viewDimension ] = String( texture.textureBindingViewDimension );
				if ( texture.textureBindingViewDimension !== viewDimension ) Object.defineProperty( texture, 'textureBindingViewDimension', { value: viewDimension } );

				return texture;

			}

			async function read( texture, level ) {

				const size = Math.max( 1, texture.width >> level );
				const bytesPerRow = Math.ceil( size * texelBytes / 256 ) * 256;
				const buffer = device.createBuffer( { size: bytesPerRow * size * 6, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ } );
				const encoder = device.createCommandEncoder();
				encoder.copyTextureToBuffer( { texture, mipLevel: level }, { buffer, bytesPerRow, rowsPerImage: size }, [ size, size, 6 ] );
				device.queue.submit( [ encoder.finish() ] );
				await buffer.mapAsync( GPUMapMode.READ );
				const mapped = new Uint8Array( buffer.getMappedRange() );
				const out = new Float64Array( size * size * 6 * 4 );
				for ( let row = 0; row < size * 6; row ++ ) {

					const bytes = mapped.slice( row * bytesPerRow, row * bytesPerRow + size * texelBytes );
					const values = half ? Array.from( new Uint16Array( bytes.buffer ), ( h ) => fromHalfFloat( h ) * 255 ) : bytes;
					out.set( values, row * size * 4 );

				}
				buffer.destroy();
				return { size, data: out };

			}

			// Bilinear sample at each destination texel center (render-pass semantics), unrounded.
			function reference( src, size ) {

				const S = src.size, out = new Float64Array( size * size * 6 * 4 );
				const at = ( l, x, y, c ) => src.data[ ( ( l * S + Math.min( S - 1, Math.max( 0, y ) ) ) * S + Math.min( S - 1, Math.max( 0, x ) ) ) * 4 + c ];

				for ( let l = 0; l < 6; l ++ ) for ( let y = 0; y < size; y ++ ) for ( let x = 0; x < size; x ++ ) {

					const u = ( x + 0.5 ) / size * S - 0.5, v = ( y + 0.5 ) / size * S - 0.5;
					const x0 = Math.floor( u ), y0 = Math.floor( v ), fx = u - x0, fy = v - y0;

					for ( let c = 0; c < 4; c ++ ) {

						out[ ( ( l * size + y ) * size + x ) * 4 + c ] =
							( at( l, x0, y0, c ) * ( 1 - fx ) + at( l, x0 + 1, y0, c ) * fx ) * ( 1 - fy ) +
							( at( l, x0, y0 + 1, c ) * ( 1 - fx ) + at( l, x0 + 1, y0 + 1, c ) * fx ) * fy;

					}

				}

				return out;

			}

			const results = [];

			for ( const size of sizes ) {

				const levels = Math.floor( Math.log2( size ) ) + 1;
				const data = half ? new Uint16Array( size * size * 6 * 4 ) : new Uint8Array( size * size * 6 * 4 );
				for ( let i = 0; i < data.length; i ++ ) data[ i ] = half ? toHalfFloat( next() ) : Math.floor( next() * 256 );

				const textures = { cube: create( size, 'cube', levels ), array: create( size, '2d-array', levels ) };
				const read_ = {};

				for ( const [ name, texture ] of Object.entries( textures ) ) {

					device.queue.writeTexture( { texture }, data, { bytesPerRow: size * texelBytes, rowsPerImage: size }, [ size, size, 6 ] );
					passUtils.generateMipmaps( texture );
					read_[ name ] = [];
					for ( let level = 0; level < levels; level ++ ) read_[ name ].push( await read( texture, level ) );
					texture.destroy();

				}

				const perLevel = [];

				for ( let level = 1; level < levels; level ++ ) {

					const row = { level, size: read_.cube[ level ].size };
					const a = read_.cube[ level ].data, b = read_.array[ level ].data;
					let maxDiff = 0, differ = 0, worst = null;

					for ( let i = 0; i < a.length; i ++ ) {

						const d = Math.abs( a[ i ] - b[ i ] );
						if ( d > 0 ) differ ++;
						if ( d > maxDiff ) { maxDiff = d; worst = i; }

					}

					row.cubeVsArray = { maxDiff, differ, of: a.length };

					if ( worst !== null ) {

						const n = row.size, t = worst >> 2;
						row.cubeVsArray.worst = { layer: Math.floor( t / ( n * n ) ), x: t % n, y: Math.floor( t / n ) % n, channel: worst & 3, cube: a[ worst ], array: b[ worst ] };

					}

					for ( const name of [ 'cube', 'array' ] ) {

						const ref = reference( read_[ name ][ level - 1 ], row.size );
						const got = read_[ name ][ level ].data;
						let maxErr = 0, over = 0;
						for ( let i = 0; i < got.length; i ++ ) {

							const e = Math.abs( got[ i ] - ref[ i ] );
							if ( e > 1 ) over ++;
							maxErr = Math.max( maxErr, e );

						}

						row[ name + 'VsRef' ] = { maxErr: + maxErr.toFixed( 3 ), overOneStep: over };

					}

					// 1×1 levels: which single texel of the 2×2 level above each cube value equals.
					if ( row.size === 1 && read_.cube[ level - 1 ].size === 2 ) {

						const src = read_.cube[ level - 1 ].data;
						const hits = [ 0, 0, 0, 0 ];
						for ( let i = 0; i < a.length; i ++ ) {

							const l = i >> 2, c = i & 3;
							for ( let t = 0; t < 4; t ++ ) if ( a[ i ] === src[ ( l * 4 + t ) * 4 + c ] ) hits[ t ] ++;

						}

						row.cubeEqualsTexel = hits; // counts for texels (0,0), (1,0), (0,1), (1,1)

					}

					perLevel.push( row );

				}

				results.push( { size, perLevel } );

			}

			const info = adapter.info || {};
			window.testResults = { format, adapter: `${ info.vendor } ${ info.architecture } ${ info.description }`, compat, coreFeatures: device.features.has( 'core-features-and-limits' ), reported, errors, results };

		</script>
	</body>
</html>
